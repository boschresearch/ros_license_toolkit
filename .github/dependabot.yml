    directory: "/" # pyproject.toml
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pre-commit"
    directory: "/" # .pre-commit-config.yaml
    schedule:
      interval: "weekly"
